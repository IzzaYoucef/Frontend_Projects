<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/Responsive_Search.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <title>Responsive Search</title>
</head>

<body>

        <input type="checkbox" id="check">

        </div>
    </div>
</body>

</html>
