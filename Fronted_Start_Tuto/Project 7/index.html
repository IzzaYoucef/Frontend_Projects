<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/f355933c08.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="container">
         <div class="timer">
             <p id="time">
                <span id="houres">00</span> :
                <span id="minutes">00</span> : 
                <span id="seconds">00</span>
            </p>
         </div>
         <div id="icons">
            <i class="fa-regular fa-circle-stop"></i>
            <i class="fa-solid fa-play" onclick="startTime()"></i>
            <i class="fa-solid fa-rotate-right"></i>
         </div>
    </div>
    <script>
        let hours = document.getElementById("houres") ; 
        let minutes = document.getElementById("minutes") ; 
        let secondes = document.getElementById("seconds") ; 

        // Get Buttons  
        let stopIcon = document.querySelector("#icons .fa-circle-stop") ;
        let playIcon = document.querySelector("#icons .fa-play") ;
        let refreshIcon = document.querySelector("#icons .fa-rotate-right");

        hours.innerHTML = '00' ;

        function startTime() {
          let variable =   setInterval(() =>  {

        
                   secondes.innerHTML++ ; 
                   let s = secondes.innerHTML < 10 ? '0' + secondes.innerHTML : secondes.innerHTML   ;
                   if ( secondes.innerHTML > 60) {
                      secondes.innerHTML = '00'
                      minutes.innerHTML = +minutes.innerHTML + 1;
                      let m = minutes.innerHTML < 10 ? '0' + minutes.innerHTML : minutes.innerHTML ; 
                      startTime(); 
                      if ( minutes.innerHTML > 60) {
                        minutes.innerHTML = '00' ;
                        hours.innerHTML++ ; 
                        let h = hours.innerHTML < 10 ? '0' + hours.innerHTML : hours.innerHTML  
                      }
                   }
                } , 1000) ;
               let stopEveryThing  =  stopIcon.addEventListener('click',() => {
             clearInterval(variable) ;
        }) ; 
          refreshIcon.addEventListener('click' , () => {
              secondes.innerHTML = '00'  ; 
              minutes.innerHTML = '00' ; 
              houres.innerHTML = '00' ;
              clearTimeout(variable ) ; 
          });
        }
       
    </script>
</body>
</html>
