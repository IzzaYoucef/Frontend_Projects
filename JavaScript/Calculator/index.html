<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
         <div class="screen"></div>
         <div class="main-operaton-numbers">
            <span class="clear">AC</span>
            <span class="delete">DE</span>
            <span class="virgule">.</span>
            <span class="devision op">/</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span class="product op">*</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span class="minus op">-</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span class="plus op">+</span>
            <span class="duble-zero" >00</span>
            <span >0</span>
            <span class="equal op" >=</span>
            <span>ON</span>
         </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
