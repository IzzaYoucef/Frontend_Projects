<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/f355933c08.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="search-box">
             <input type="text" placeholder="Enter City Name..">
             <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="weather-box">
            <div class="weather-informations">
                <div class="wheather-state">
                    <img src="./../Clear.pnj.webp" alt="Cloud Image">
                     <p id="city-name">Algeria</p>
                     <span class="degrees">30°C</span>
                </div>
                   <div class="details">
                   
                    <p class="humidity"> humidity 40%</p>
                     <p class="wind-spees"> Wind Speed 25km/h</p>
                    <img src="../Images/pngwing.com.png" class="wind" alt="">
                    <img src="../Images/humidity.png" alt="" id="Humidity">
                   </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
